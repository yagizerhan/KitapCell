<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kayıt Ol — KitapCell</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico">
  <style>
    body { background: radial-gradient(ellipse at top, rgba(99,102,241,.1) 0%, var(--bg) 60%); }
  </style>
</head>
<body>
<div class="form-wrapper">
  <div class="form-card fade-in">
    <div class="form-logo">
      <div class="icon">📚</div>
      <h1>Kayıt Ol</h1>
      <p>KitapCell'e üye olarak kütüphaneye erişin</p>
    </div>

    <div class="form-error" id="errBox"></div>

    <form id="regForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group" style="margin-bottom:0">
          <label for="firstName">Ad</label>
          <input type="text" id="firstName" placeholder="Adınız" required autocomplete="given-name">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label for="lastName">Soyad</label>
          <input type="text" id="lastName" placeholder="Soyadınız" required autocomplete="family-name">
        </div>
      </div>
      <div class="form-group" style="margin-top:18px">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" placeholder="ornek@eposta.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Şifre <span style="color:var(--muted);font-weight:400;">(en az 6 karakter)</span></label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="password2">Şifre Tekrar</label>
        <input type="password" id="password2" placeholder="••••••••" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
        Hesap Oluştur
      </button>
    </form>

    <div class="form-footer">
      Zaten hesabın var mı? <a href="/login.html">Giriş Yap</a>
    </div>
  </div>
</div>

<script>
  fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/index.html'; });

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('errBox');
    const btn    = document.getElementById('submitBtn');
    errBox.classList.remove('show');

    const pw  = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;
    if (pw !== pw2) {
      errBox.textContent = 'Şifreler eşleşmiyor.';
      errBox.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Kaydediliyor...';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName: document.getElementById('firstName').value.trim(),
          lastName:  document.getElementById('lastName').value.trim(),
          email:     document.getElementById('email').value.trim(),
          password:  pw
        })
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/index.html';
      } else {
        errBox.textContent = data.error ?? 'Kayıt başarısız.';
        errBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Hesap Oluştur';
      }
    } catch {
      errBox.textContent = 'Sunucuya bağlanılamadı.';
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Hesap Oluştur';
    }
  });
</script>
</body>
</html>
