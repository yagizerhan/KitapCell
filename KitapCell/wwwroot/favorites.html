<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorilerim — KitapCell</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div style="max-width:960px;margin:0 auto;padding-top:4px;">
      <div class="page-header" style="margin-bottom:22px;">
        <span class="page-title">❤️ Favorilerim</span>
        <a href="/index.html" class="btn btn-outline btn-sm">← Kataloğa Dön</a>
      </div>

      <div id="container">
        <div class="loader"><div class="spinner"></div></div>
      </div>
    </div>
  </main>
</div>

<script src="app.js?v=2"></script>
<script>
async function init() {
  const user = await requireAuth();
  if (!user) return;
  buildNavbar(user);
  buildSidebar();

  const r = await fetch('/api/me/favorites');
  const el = document.getElementById('container');

  if (!r.ok) {
    el.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>Favoriler yüklenemedi.</p></div>';
    return;
  }

  const favs = await r.json();

  if (!favs.length) {
    el.innerHTML = `<div class="empty">
      <div class="icon">🤍</div>
      <p>Henüz favoriye eklenen kitap yok.</p>
      <a href="/index.html" class="btn btn-primary" style="margin-top:16px;display:inline-flex;">Kataloğa Göz At</a>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="books-grid fade-in" id="grid"></div>`;
  const grid = document.getElementById('grid');

  favs.forEach(b => {
    const card = document.createElement('a');
    card.className = 'book-card';
    card.href = `/book.html?id=${b.id}`;
    card.innerHTML = `
      <div class="book-cover">📘</div>
      <div class="book-info">
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}</div>
        <div class="book-footer">
          <span class="badge ${b.available ? 'badge-success' : 'badge-warning'}">
            ${b.available ? '✅ Müsait' : '📤 Ödünçte'}
          </span>
          <span style="color:var(--danger);font-size:1rem;cursor:pointer;" title="Favoriden çıkar"
            onclick="removeFav(event,${b.id},this)">❤️</span>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}

async function removeFav(e, id, el) {
  e.preventDefault();
  const r = await api('POST', `/api/books/${id}/favorite`);
  if (r.ok && !r.data.isFavorite) {
    el.closest('.book-card').remove();
    showToast('Favorilerden çıkarıldı.', 'success');
    if (!document.querySelectorAll('.book-card').length) {
      document.getElementById('container').innerHTML = `<div class="empty">
        <div class="icon">🤍</div><p>Favori kitap kalmadı.</p>
      </div>`;
    }
  }
}

init();
</script>
</body>
</html>
